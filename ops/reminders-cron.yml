name: Wake reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder job (wakes Render free)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            -X POST 'https://spaces-board.onrender.com/internal/reminders' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            --max-time 90)
          echo "HTTP $code"
          head -c 200 /tmp/out.txt || true
          test "$code" = "200" -o "$code" = "204"
